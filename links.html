<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NÓMADE Lab. — Reservas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --black:   #0a0a0a;
      --dark:    #111111;
      --accent:  #e8ff47;
      --white:   #f5f5f0;
      --gray:    rgba(245,245,240,0.55);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: 'DM Sans', sans-serif;
      background: var(--black);
      color: var(--white);
      overflow-x: hidden;
    }

    /* ── BACKGROUND SLIDESHOW ── */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    .bg-slide {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 1.4s ease;
    }

    .bg-slide.active { opacity: 1; }

    .bg-slide:nth-child(1) { background-image: url('og.jpg'); }

    /* Overlay oscuro degradado para legibilidad */
    .bg-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(10,10,10,0.55) 0%,
        rgba(10,10,10,0.72) 50%,
        rgba(10,10,10,0.90) 100%
      );
    }

    /* ── LAYOUT PRINCIPAL ── */
    .wrapper {
      position: relative;
      z-index: 1;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px 56px;
      gap: 0;
    }

    /* ── LOGO / MARCA ── */
    .brand {
      text-align: center;
      margin-bottom: 36px;
      animation: fadeUp 0.7s ease both;
    }

    .brand-logo {
      width: clamp(160px, 48vw, 240px);
      filter: brightness(0) invert(1);
      display: block;
      margin: 0 auto;
    }

    .brand-sub {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--gray);
      margin-top: 10px;
    }

    /* ── TAGLINE ── */
    .tagline {
      font-size: clamp(13px, 3.5vw, 15px);
      font-weight: 300;
      color: var(--gray);
      text-align: center;
      max-width: 280px;
      line-height: 1.6;
      margin-bottom: 44px;
      animation: fadeUp 0.7s 0.15s ease both;
    }

    /* ── BOTONES ── */
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 340px;
      animation: fadeUp 0.7s 0.3s ease both;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 18px 24px;
      border-radius: 3px;
      text-decoration: none;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.04em;
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
      cursor: pointer;
      border: none;
      position: relative;
      overflow: hidden;
    }

    .btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: white;
      opacity: 0;
      transition: opacity 0.18s ease;
    }

    .btn:active::after { opacity: 0.12; }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(0,0,0,0.45);
    }

    /* Botón 1 — BoxMagic (acento amarillo) */
    .btn-boxmagic {
      background: var(--accent);
      color: var(--black);
    }

    .btn-boxmagic:hover {
      background: #d4eb30;
    }

    /* Botón 2 — ClassPass (blanco con borde) */
    .btn-classpass {
      background: transparent;
      color: var(--white);
      border: 1.5px solid rgba(245,245,240,0.55);
      backdrop-filter: blur(8px);
    }

    .btn-classpass:hover {
      background: rgba(245,245,240,0.1);
      border-color: var(--white);
    }

    /* Botón 3 — WhatsApp (verde oscuro elegante) */
    .btn-whatsapp {
      background: #1a3a2a;
      color: var(--white);
      border: 1.5px solid rgba(37,211,102,0.3);
    }

    .btn-whatsapp:hover {
      background: #1f4a34;
      border-color: rgba(37,211,102,0.6);
    }

    /* Íconos SVG inline */
    .btn-icon {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
    }

    /* ── FOOTER ── */
    .footer {
      margin-top: 44px;
      text-align: center;
      animation: fadeUp 0.7s 0.45s ease both;
    }

    .footer a {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gray);
      text-decoration: none;
      transition: color 0.2s;
    }

    .footer a:hover { color: var(--white); }

    /* ── ANIMACIONES ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── MOBILE FINE-TUNING ── */
    @media (max-width: 390px) {
      .btn { padding: 17px 20px; font-size: 14px; }
    }
  </style>
</head>
<body>

      <a href="https://www.nomadelab.net" target="_blank" rel="noopener">

  </div>



</body>
</html>
